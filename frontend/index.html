<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>FOBE Model View</title></head>
  <body>
    <main class="model-app">
      <header class="model-header"><div><h1>Model view</h1></div><nav class="app-nav" aria-label="Application pages"><a class="active" href="./">Model view</a><a href="./asset-mapping.html">Asset mapping</a></nav><div class="model-switcher"><label for="model-select">Active model</label><select id="model-select" title="Building Overview is inspection only"></select></div><p id="model-status" class="model-status" aria-live="polite">Starting 3D engine…</p></header>
      <section class="model-layout" aria-label="BIM model review">
        <section class="viewer-stage"><div id="viewer"></div><div id="viewer-overlay" class="viewer-overlay">Loading model…</div><div class="viewer-navigation" aria-label="Camera navigation"><button data-view="front">Front</button><button data-view="top">Top</button><button data-view="back">Back</button><button data-view="left">Left</button><button data-view="right">Right</button><button data-view="reset">Reset</button></div><div class="viewer-caption"><span id="active-model">Building Overview</span><span id="selected-element">Select an element or mapped item to focus it</span></div></section>
        <aside class="side-panel side-browser"><div class="side-tabs" role="tablist" aria-label="Model information"><button id="tab-mappings" class="active" role="tab" aria-selected="true" aria-controls="mapping-pane" data-side-tab="mapping-pane">Mapping results</button><button id="tab-assets" role="tab" aria-selected="false" aria-controls="assets-pane" data-side-tab="assets-pane">itemit assets</button></div><section id="mapping-pane" class="browser-pane" role="tabpanel" aria-labelledby="tab-mappings"><div class="side-heading"><div><p class="panel-kicker">Confirmed links <span id="mapping-count"></span></p><h2>Mapping results</h2></div></div><div class="filter-row mapping-filter-row"><div class="collection-tree-filter"><button id="mapping-tree-trigger" class="mapping-tree-trigger" type="button" aria-expanded="false" aria-controls="mapping-tree-popover">Select a category</button><div id="mapping-tree-popover" class="mapping-tree-popover" hidden><div class="mapping-tree-actions"><button id="mapping-tree-expand" type="button">Expand all</button><button id="mapping-tree-collapse" type="button">Collapse all</button><button id="mapping-tree-clear" type="button">Clear filter</button></div><div id="mapping-tree" class="mapping-tree" role="tree" aria-label="itemit collection hierarchy"></div></div><p id="mapping-hierarchy-note" class="mapping-hierarchy-note" role="status" hidden></p></div><input id="mapping-search" type="search" placeholder="Search mapped assets or IFC IDs..." aria-label="Search mapping results" disabled /></div><div id="mapping-list" class="result-list"></div><div id="mapping-pager" class="pager" aria-label="Mapping results pages" hidden><button id="mapping-previous" type="button">Previous</button><span id="mapping-page"></span><button id="mapping-next" type="button">Next</button></div><button id="export-mappings-csv" class="export-mappings-csv" type="button">Export mappings (CSV)</button></section><section id="assets-pane" class="browser-pane" role="tabpanel" aria-labelledby="tab-assets" hidden><div class="side-heading"><div><p class="panel-kicker">itemit</p><h2>Unmapped assets</h2></div><span id="asset-count"></span></div><p class="pane-help">Only assets without a confirmed IFC mapping are shown here.</p><div id="asset-selection" class="asset-selection" hidden></div><input id="asset-search" type="search" placeholder="Search itemit assets..." aria-label="Search itemit assets" /><div class="asset-collection-filter"><button id="asset-tree-trigger" class="asset-tree-trigger" type="button" aria-expanded="false" aria-controls="asset-tree-popover">All collections</button><div id="asset-tree-popover" class="asset-tree-popover" hidden><div class="asset-tree-actions"><button id="asset-tree-expand" type="button">Expand all</button><button id="asset-tree-collapse" type="button">Collapse all</button><button id="asset-tree-clear" type="button">All collections</button></div><div id="asset-tree" class="asset-tree" role="tree" aria-label="itemit asset collection hierarchy"></div></div><p id="asset-hierarchy-note" class="asset-hierarchy-note" role="status" hidden></p></div><div id="unmapped-assets" class="asset-list"></div><div class="pager" aria-label="Unmapped asset pages"><button id="asset-previous" type="button">Previous</button><span id="asset-page"></span><button id="asset-next" type="button">Next</button></div></section></aside>
      </section>
    </main><script type="module" src="/src/model-view.js"></script>
  </body>
</html>
